<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distinct Mood Assessment</title>
<style>
  @font-face {
    font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 500 700; font-display: swap;
    src: url("fonts/bricolage-grotesque-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Figtree"; font-style: normal; font-weight: 400 600; font-display: swap;
    src: url("fonts/figtree-latin.woff2") format("woff2");
  }
  html, body { margin: 0; height: 100%; }
  html { color-scheme: light; }
  /* Layout: one phone-width column; a single task per screen, a sticky action bar at the foot. */
  :root {
    --bg: #edf1f0;
    --surface: #f9fbfa;
    --ink: #14211f;
    --muted: #586966;
    --line: #c9d5d2;
    --accent: #0e7a74;
    --accent-ink: #f4fffd;
    --accent-soft: #d3ebe7;
    --focus: #0e7a74;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
    --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1716; --surface: #172321; --ink: #e6efed; --muted: #93a8a4; --line: #2b3d3a;
      --accent: #5cd6c8; --accent-ink: #04201d; --accent-soft: #1d3d39; --focus: #5cd6c8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1716; --surface: #172321; --ink: #e6efed; --muted: #93a8a4; --line: #2b3d3a;
    --accent: #5cd6c8; --accent-ink: #04201d; --accent-soft: #1d3d39; --focus: #5cd6c8;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 17px/1.45 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }
  .shell { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  header.top { padding-block: 22px 6px; display: flex; flex-direction: column; gap: 12px; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .dots { display: flex; gap: 5px; flex-wrap: wrap; min-height: 6px; }
  .dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); transition: background .25s; }
  .dots i.on { background: var(--accent); }

  main { flex: 1; padding-block: 8px 24px; animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  h1 { font: 700 clamp(30px, 8vw, 38px)/1.08 var(--font-display); letter-spacing: -.02em; margin: 6px 0 10px; text-wrap: balance; }
  .lede { color: var(--muted); margin: 0 0 22px; max-width: 34em; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 0; margin: 0 0 26px; list-style: none; }
  .chip {
    appearance: none; font: 500 17px/1 var(--font-body); color: var(--ink);
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px;
    min-height: 46px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer; transition: background .15s, border-color .15s, color .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:active { transform: scale(.96); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip .tick { width: 0; overflow: hidden; transition: width .15s; font-weight: 700; }
  .chip[aria-pressed="true"] .tick { width: 14px; }

  label.other { display: block; font-weight: 600; margin-bottom: 8px; }
  input.other {
    width: 100%; font: 400 17px var(--font-body); color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px;
  }
  input.other::placeholder { color: var(--muted); }

  .word { font: 700 clamp(44px, 14vw, 64px)/1 var(--font-display); letter-spacing: -.03em; margin: 14px 0 12px; overflow-wrap: anywhere; }
  /* All ten values always share one row; tiles get taller and narrower as the viewport shrinks. */
  .scale { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: clamp(3px, 1.2vw, 8px); margin: 24px 0 10px; }
  .tile {
    appearance: none; font: 600 clamp(14px, 4.4vw, 22px)/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink);
    background: var(--surface); border: 1.5px solid var(--line); border-radius: clamp(8px, 2.4vw, 14px);
    padding: 0; min-width: 0; aspect-ratio: 1 / 1.7;
    cursor: pointer; transition: background .15s, border-color .15s, color .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:active { transform: scale(.94); }
  .tile[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .anchors { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }

  .bar {
    position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 12px;
  }
  .bar .count { flex: 1; min-width: 0; color: var(--muted); font-size: 15px; }
  .btn {
    appearance: none; font: 600 17px/1 var(--font-body); border-radius: 999px; min-height: 50px; padding: 0 26px;
    border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .bar .btn.wide { flex: 1; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .results { list-style: none; padding: 0; margin: 0 0 24px; display: grid; gap: 10px; }
  .results li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
  .results .w { font-weight: 600; }
  .results .n { font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; }
  .results .track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .results .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .proto { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 22px; }
  .proto summary { cursor: pointer; font-weight: 600; }
  .proto p { color: var(--muted); font-size: 15px; margin: 10px 0; }
  .proto pre { margin: 0; overflow-x: auto; font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; max-height: 340px; }
  .err { color: var(--ink); background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .chip, .tile, .dots i { transition: none; }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <span class="eyebrow" id="eyebrow">Right now</span>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </header>
  <main id="stage" aria-live="polite"></main>
  <div class="bar" id="bar"></div>
</div>

<script>
(function () {
  "use strict";

  // 13 constructs x 2 items (Distinct Mood Assessment, adapted from the PANAS-X). Participants never see the constructs.
  var ITEMS = [
    ["energetic", "Energy"], ["active", "Energy"],
    ["attentive", "Attentiveness"], ["concentrating", "Attentiveness"],
    ["excited", "Excitement"], ["enthusiastic", "Excitement"],
    ["interested", "Interest"], ["motivated", "Interest"],
    ["proud", "Self-assurance"], ["confident", "Self-assurance"],
    ["happy", "Joviality"], ["cheerful", "Joviality"],
    ["calm", "Serenity"], ["relaxed", "Serenity"],
    ["tired", "Fatigue"], ["sluggish", "Fatigue"],
    ["bored", "Apathy"], ["apathetic", "Apathy"],
    ["sad", "Sadness"], ["down", "Sadness"],
    ["anxious", "Anxiety"], ["worried", "Anxiety"],
    ["angry", "Hostility"], ["irritable", "Hostility"],
    ["stressed", "Stress"], ["overwhelmed", "Stress"]
  ];
  var MAX_OTHER = 40;

  var params = new URLSearchParams(location.search);
  var token = params.get("token") || "";
  var callbackUrl = params.get("callback_url") || "";
  var viaCallback = !!(token && callbackUrl);
  // Embedded in the bot's launch page (?embed=1): report with the m2c2 `m2c2:complete` message.
  var embed = params.get("embed") === "1" && window.parent !== window;
  var demo = !embed && !viaCallback;
  var seedParam = params.get("seed");

  // --- seeded shuffling: the same prompt (seed) always shows the same orders -----------------
  function hashString(s) {
    var h = 1779033703 ^ s.length;
    for (var i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rngFor(seed, stream) { return mulberry32(hashString(seed + ":" + stream)()); }
  function shuffled(list, rnd) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function newSeed() {
    var buf = new Uint32Array(1);
    (window.crypto || window.msCrypto).getRandomValues(buf);
    return String(buf[0]);
  }

  // --- state ---------------------------------------------------------------------------------
  var S = {};
  function reset(seed) {
    S = {
      seed: seed, step: "pick", listOrder: null, picked: {}, other: "", queue: [], idx: 0,
      ratings: {}, rt: {}, startedAt: new Date().toISOString(), viewShownAt: Date.now(), payload: null, error: ""
    };
    S.listOrder = shuffled(ITEMS.map(function (x) { return x[0]; }), rngFor(seed, "list"));
  }
  reset(seedParam || newSeed());

  var $stage = document.getElementById("stage");
  var $bar = document.getElementById("bar");
  var $dots = document.getElementById("dots");
  var $eyebrow = document.getElementById("eyebrow");

  function h(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === "text") el.textContent = attrs[k];
      else if (k === "onclick") el.addEventListener("click", attrs[k]);
      else if (k === "oninput") el.addEventListener("input", attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) if (arguments[i]) el.appendChild(arguments[i]);
    return el;
  }
  function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }
  function constructOf(item) { for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i][0] === item) return ITEMS[i][1]; return null; }
  function chosen() { return S.listOrder.filter(function (w) { return S.picked[w]; }); }
  function otherText() { return S.other.replace(/\s+/g, " ").trim().slice(0, MAX_OTHER); }

  function setDots(total, done) {
    $dots.textContent = "";
    for (var i = 0; i < total; i++) $dots.appendChild(h("i", { "class": i < done ? "on" : "" }));
  }

  // --- screens -------------------------------------------------------------------------------
  function viewPick() {
    S.step = "pick";
    var picked = chosen().length;
    $eyebrow.textContent = "Right now";
    setDots(0, 0);
    var list = h("ul", { "class": "chips", "aria-label": "Feelings" });
    S.listOrder.forEach(function (w) {
      var chip = h("button", { type: "button", "class": "chip", "aria-pressed": S.picked[w] ? "true" : "false" },
        h("span", { "class": "tick", "aria-hidden": "true", text: "✓" }), h("span", { text: cap(w) }));
      chip.addEventListener("click", function () {
        S.picked[w] = !S.picked[w];
        chip.setAttribute("aria-pressed", S.picked[w] ? "true" : "false");
        renderPickBar();
      });
      list.appendChild(h("li", {}, chip));
    });
    var other = h("input", { "class": "other", id: "other", type: "text", maxlength: String(MAX_OTHER), autocomplete: "off",
      placeholder: "Another feeling, if none of these fit", value: S.other });
    other.addEventListener("input", function () { S.other = other.value; renderPickBar(); });
    swap(
      h("h1", { text: "How do you feel right now?" }),
      h("p", { "class": "lede", text: "Tap every word that describes how you feel at this moment. Pick as many as you like." }),
      list,
      h("label", { "class": "other", "for": "other", text: "Something else?" }),
      other
    );
    renderPickBar();
  }

  function renderPickBar() {
    var n = chosen().length + (otherText() ? 1 : 0);
    $bar.textContent = "";
    $bar.appendChild(h("span", { "class": "count", text: n === 0 ? "Nothing selected yet" : n + " selected" }));
    $bar.appendChild(h("button", { type: "button", "class": "btn", onclick: startRating, text: n === 0 ? "None of these fit" : "Continue" }));
  }

  function startRating() {
    var items = chosen();
    var extra = otherText();
    var rnd = rngFor(S.seed, "rate");
    S.queue = shuffled(items.concat(extra ? ["\u0000other"] : []), rnd);
    S.idx = 0;
    if (!S.queue.length) return finish();
    viewRate();
  }

  function labelOf(key) { return key === "\u0000other" ? otherText() : key; }

  function viewRate() {
    S.step = "rate";
    S.viewShownAt = Date.now();
    var key = S.queue[S.idx];
    var total = S.queue.length;
    $eyebrow.textContent = "Feeling " + (S.idx + 1) + " of " + total;
    setDots(total, S.idx + 1);
    var scale = h("div", { "class": "scale", role: "radiogroup", "aria-label": "How strongly, from 1 to 10" });
    for (var v = 1; v <= 10; v++) (function (v) {
      var t = h("button", { type: "button", "class": "tile", role: "radio", "aria-checked": S.ratings[key] === v ? "true" : "false", text: String(v) });
      t.addEventListener("click", function () {
        S.ratings[key] = v;
        if (S.rt[key] == null) S.rt[key] = Date.now() - S.viewShownAt;
        Array.prototype.forEach.call(scale.children, function (c, i) { c.setAttribute("aria-checked", i + 1 === v ? "true" : "false"); });
        renderRateBar();
      });
      scale.appendChild(t);
    })(v);
    swap(
      h("p", { "class": "lede", text: "How strongly do you feel this right now?" }),
      h("div", { "class": "word", text: cap(labelOf(key)) }),
      scale,
      h("div", { "class": "anchors" }, h("span", { text: "1 = very weak" }), h("span", { text: "10 = very strong" }))
    );
    renderRateBar();
  }

  function renderRateBar() {
    var key = S.queue[S.idx];
    var last = S.idx === S.queue.length - 1;
    $bar.textContent = "";
    $bar.appendChild(h("button", { type: "button", "class": "btn quiet", onclick: back, text: "Back" }));
    var next = h("button", { type: "button", "class": "btn wide", onclick: forward, text: last ? "Finish" : "Next" });
    if (S.ratings[key] == null) next.disabled = true;
    $bar.appendChild(next);
  }
  function back() { if (S.idx === 0) viewPick(); else { S.idx--; viewRate(); } }
  function forward() { if (S.idx < S.queue.length - 1) { S.idx++; viewRate(); } else finish(); }

  // --- result --------------------------------------------------------------------------------
  function buildPayload() {
    var trials = S.queue.map(function (key, i) {
      var isOther = key === "\u0000other";
      return {
        trial_index: i, item: labelOf(key), construct: isOther ? null : constructOf(key), other: isOther,
        intensity: S.ratings[key], list_position: isOther ? null : S.listOrder.indexOf(key) + 1,
        rating_position: i + 1, rt_ms: S.rt[key] == null ? null : S.rt[key]
      };
    });
    var ratings = {};
    trials.forEach(function (t) { ratings[t.other ? "other: " + t.item : t.item] = t.intensity; });
    var finished = new Date();
    return {
      assessment: "dma", pid: params.get("pid") || "",
      summary: {
        n_trials: trials.length, ratings: ratings, other_text: otherText() || null, seed: S.seed,
        list_order: S.listOrder, started_at: S.startedAt, finished_at: finished.toISOString(),
        duration_s: +((finished - new Date(S.startedAt)) / 1000).toFixed(1)
      },
      data: { trials: trials }
    };
  }

  function finish() {
    S.payload = buildPayload();
    if (embed) {
      try { window.parent.postMessage(Object.assign({ type: "m2c2:complete" }, S.payload), "*"); }
      catch (e) { console.warn("[dma] parent postMessage failed", e); }
      return viewDone();
    }
    if (viaCallback) return send();
    viewDone();
  }

  function send() {
    S.step = "sending";
    $eyebrow.textContent = "Saving";
    swap(h("h1", { text: "Saving your answers" }), h("p", { "class": "lede", text: "One moment." }));
    $bar.textContent = "";
    fetch(callbackUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token, data: S.payload }) })
      .then(function (r) { if (!r.ok) throw new Error("status " + r.status); viewDone(); })
      .catch(function () {
        S.error = "Your answers did not save. Check your connection and try again.";
        swap(
          h("h1", { text: "Not saved yet" }),
          h("div", { "class": "err", role: "alert", text: S.error })
        );
        $bar.textContent = "";
        $bar.appendChild(h("button", { type: "button", "class": "btn wide", onclick: send, text: "Try again" }));
      });
  }

  function viewDone() {
    S.step = "done";
    $eyebrow.textContent = "Done";
    setDots(0, 0);
    var rows = S.payload.data.trials.slice().sort(function (a, b) { return b.intensity - a.intensity; });
    var list = h("ul", { "class": "results" });
    rows.forEach(function (r) {
      var fill = h("div", { "class": "fill" });
      fill.style.width = (r.intensity * 10) + "%";
      list.appendChild(h("li", {}, h("span", { "class": "w", text: cap(r.item) }), h("span", { "class": "n", text: String(r.intensity) }),
        h("div", { "class": "track" }, fill)));
    });
    var nodes = [h("h1", { text: "Thank you" })];
    if (rows.length) {
      nodes.push(h("p", { "class": "lede", text: "Here is what you told us." }), list);
    } else {
      nodes.push(h("p", { "class": "lede", text: "You said none of these words fit right now. That is a valid answer." }));
    }
    if (demo) {
      var pre = h("pre", { text: JSON.stringify(S.payload, null, 2) });
      nodes.push(h("details", { "class": "proto" },
        h("summary", { text: "Prototype: what the bot receives" }),
        h("p", { text: "In the study the bot’s launch page receives this message from the page and stores the summary and one row per rated feeling. Item order and rating order come from the seed, so a prompt always reproduces the same orders." }),
        pre));
    }
    swap.apply(null, nodes);
    $bar.textContent = "";
    if (demo) $bar.appendChild(h("button", { type: "button", "class": "btn wide", onclick: function () { reset(newSeed()); viewPick(); }, text: "Try a new prompt" }));
  }

  function swap() {
    var fresh = $stage.cloneNode(false);
    for (var i = 0; i < arguments.length; i++) fresh.appendChild(arguments[i]);
    $stage.parentNode.replaceChild(fresh, $stage);
    $stage = fresh;
    window.scrollTo(0, 0);
  }

  viewPick();
})();
</script>
</body>
</html>
